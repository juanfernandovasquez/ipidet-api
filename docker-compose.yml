services:
  mongodb:
    image: mongo:7
    container_name: ipidet_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ipidet_agent
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: ipidet_mongo_ui
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: ipidet2026
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo_data:
