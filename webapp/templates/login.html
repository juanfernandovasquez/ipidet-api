<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — IPIDET</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-2xl font-bold text-slate-800 tracking-tight">IPIDET</div>
      <div class="text-slate-500 text-sm mt-1">Panel de Administración</div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
      <h1 class="text-lg font-semibold text-slate-800 mb-6">Iniciar sesión</h1>

      {% if error %}
      <div class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700 flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">
        <input type="hidden" name="next" value="{{ next }}">

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Correo electrónico</label>
          <input
            type="email" name="email" required autofocus
            placeholder="tu@correo.com"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Contraseña</label>
          <input
            type="password" name="password" required
            placeholder="••••••••"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>

        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition-colors">
          Ingresar
        </button>
      </form>
    </div>
  </div>

</body>
</html>
