<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — IPIDET</title>
  <link rel="icon" type="image/png" href="/static/isotipo.png">
  {% include "_head.html" %}
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 lg:grid lg:grid-cols-[minmax(0,5fr)_minmax(0,6fr)]">

  <aside class="login-marca hidden lg:flex flex-col justify-between p-12 text-white">
    <img src="/static/logo-blanco.png" alt="IPIDET" class="h-10 w-auto self-start">
    <div>
      <p class="font-display text-[38px] leading-[46px] font-medium max-w-md">
        Instituto Peruano de Investigación y Desarrollo Tributario
      </p>
      <p class="text-[#a9b8ae] mt-4">Plataforma de administración</p>
    </div>
  </aside>

  <main class="flex min-h-screen lg:min-h-0 items-center justify-center p-6">
    <div class="w-full max-w-sm">
      <img src="/static/logo.png" alt="IPIDET" class="h-10 w-auto mb-8 lg:hidden">
      <h1 class="font-display text-[28px] leading-9 font-semibold text-slate-900">Iniciar sesión</h1>
      <p class="text-sm text-slate-600 mt-1 mb-7">Ingresa con tu correo institucional.</p>

      {% if error %}
      <div role="alert" class="mb-5 p-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-800 flex items-start gap-2">
        <i class="fa-solid fa-circle-exclamation mt-0.5" aria-hidden="true"></i> <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">
        <input type="hidden" name="next" value="{{ next }}">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Correo electrónico</label>
          <input id="email" type="email" name="email" required autofocus autocomplete="username" class="input w-full py-2.5">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Contraseña</label>
          <input id="password" type="password" name="password" required autocomplete="current-password" class="input w-full py-2.5">
        </div>
        <button type="submit" class="btn-primary w-full py-2.5">Ingresar</button>
      </form>
    </div>
  </main>
</body>
</html>
